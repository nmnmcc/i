[workspace]
resolver = "2"
members = ["compiler-core", "language-server", "format", "pretty-arena", "src-span", "hexpm"]

# common dependencies
[workspace.dependencies]
# Command line interface
clap = { version = "4", features = ["derive"] }
# Immutable data structures
imbl = { version = "7", features = ["serde"] }
# Extra iter methods
itertools = "0"
# Parsing
regex = "1"
# Colours in terminal
termcolor = "1"
# Data (de)serialisation
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# toml config file parsing
toml = "1.1"
# Enum trait impl macros
strum = { version = "0", features = ["derive"] }
# Logging
tracing = "0"
# HTTP types
http = "1"
# Little helper to omit fields that cannot be debug printed
debug-ignore = "1"
# base encoding
base16 = "0"
# Language server protocol server plumbing
lsp-server = "0"
lsp-types = { package = "gen-lsp-types", version = "0.5.0", features = ["url"] }
# Compact clone-on-write vector & string type
ecow = "0"
# Drop in replacement for std::path but with only utf-8
camino = "1"
# std::error::Error definition macro
thiserror = "2"
# Test assertion errors with diffs
pretty_assertions = "1"
# Snapshot testing to make test maintenance easier
insta = { version = "1", features = ["glob"] }
# Non-empty vectors
vec1 = { version = "1", features = ["serde"] }
# Pubgrub dependency resolution algorithm
pubgrub = "0.3"
# Recursively traversing directories
ignore = "0"
# Parsing of arbitrary width int values
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.19"
# Unicode grapheme traversal
unicode-segmentation = "1.13.2"
# Checksums
xxhash-rust = { version = "0", features = ["xxh3"] }
# Source spans and line numbers
src-span = { path = "./src-span" }
