[package]
name = "ilang-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
num-bigint.workspace = true
thiserror.workspace = true

# The transitional old printer is owned by the one-tree lane. Its disabled
# helper remains known until that file is removed; no Cargo feature enables it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("legacy"))'] }

[dev-dependencies]
serde_json.workspace = true

migration-syntax = { package = "ilang-syntax-migration", path = "examples/legacy" }
