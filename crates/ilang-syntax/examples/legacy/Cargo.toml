[package]
name = "ilang-syntax-migration"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[lib]
name = "ilang_syntax"

[dependencies]
syntax3 = { package = "ilang-syntax", path = "../.." }
num-bigint = "0.5.1"
serde_json = "1"

[[bin]]
name = "migrate-tests"
path = "migrate-tests.rs"
