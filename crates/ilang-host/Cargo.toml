[package]
name = "ilang-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wasmtime embedding and versioned host ABI for iLang"

[dependencies]
anyhow.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
wasmparser.workspace = true
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "cranelift", "gc", "gc-copying", "gc-drc", "gc-null", "runtime", "std", "backtrace", "parallel-compilation"] }

[dev-dependencies]
wat = "=1.262.0"
