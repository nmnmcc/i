[package]
name = "ilang-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wasmtime embedding and versioned host ABI for the i programming language"

[dependencies]
ilang-syntax = { path = "../ilang-syntax" }
anyhow.workspace = true
getrandom = "0.3.4"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time", "io-util", "io-std", "sync", "fs", "net", "process"] }
wasmparser.workspace = true
# The runtime alone: the native runner (crates/ilang-runner) loads
# precompiled code and has no compiler. `compiler` adds Cranelift.
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "gc", "gc-copying", "gc-drc", "gc-null", "runtime", "std", "backtrace"] }
target-lexicon = "0.13.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"

[features]
default = ["compiler"]
# Compile Wasm with Cranelift: `Program::from_bytes` and native packaging.
compiler = ["wasmtime/cranelift", "wasmtime/parallel-compilation"]

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time", "test-util", "net"] }
wat = "=1.262.0"
