[package]
name = "ilang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ilang_cli"
path = "src/lib.rs"

[[bin]]
name = "i"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ilang-package.workspace = true
ilang-check.workspace = true
ilang-wasm.workspace = true
ilang-binaryen.workspace = true
ilang-host.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
ilang-lsp.workspace = true
ilang-macro.workspace = true
ilang-syntax.workspace = true

[dev-dependencies]
num-bigint.workspace = true
wasmtime = { version = "=50.0.0", default-features = false, features = ["anyhow", "cranelift", "gc", "gc-drc", "runtime", "std"] }

[[test]]
name = "spec"
path = "tests/spec.rs"
harness = false
