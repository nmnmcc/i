name = "i"
grammar = "i"
path_suffixes = ["i"]
line_comments = ["// ", "/// ", "//// "]
autoclose_before = ":.,=}])>"
tab_size = 4
hard_tabs = true
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "<<", end = ">>", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
