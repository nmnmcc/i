[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/ilang-syntax/examples/legacy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
wasmparser = "=0.262.0"
petgraph = "0.8"
rustc-hash = "2"
ilang-syntax = { path = "crates/ilang-syntax" }
ilang-package = { path = "crates/ilang-package" }
ilang-check = { path = "crates/ilang-check" }
ilang-wasm = { path = "crates/ilang-wasm" }
ilang-host = { path = "crates/ilang-host" }
ilang-binaryen = { path = "crates/ilang-binaryen" }
ilang-lsp = { path = "crates/ilang-lsp" }
ilang-macro = { path = "crates/ilang-macro" }

[profile.dev]
debug = 1

# Dependencies such as Wasmtime and Cranelift run i programs in tests, and are
# many times slower without optimization; the compiler's own crates stay
# quick to rebuild. Optimizing those too (opt-level 1) was measured and does
# not make the tests faster (docs/performance.md).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
