[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/ilang-cli", "crates/ilang-frontend", "crates/ilang-wasm", "crates/ilang-lsp"]
exclude = ["compiler"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
ecow = { version = "0.3.1", features = ["serde"] }
imbl = { version = "7", features = ["serde"] }
num-bigint = { version = "0.5.1", features = ["serde"] }
num-traits = "0.2.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
sha2 = "0.10"
insta = { version = "1", features = ["glob"] }
tempfile = "3"
wasm-encoder = "=0.262.0"
wasmparser = "=0.262.0"
ilang-core = { path = "compiler/compiler-core" }
ilang-format = { path = "compiler/format" }
ilang-language-server = { path = "compiler/language-server" }
src-span = { path = "compiler/src-span" }
ilang-frontend = { path = "crates/ilang-frontend" }
ilang-wasm = { path = "crates/ilang-wasm" }
ilang-lsp = { path = "crates/ilang-lsp" }
ilang-host = { path = "crates/ilang-host" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
