name: Nix

# The flake installation path: `packages.i` built from source, and
# `packages.i-bin` installed from a prebuilt archive. Binaryen is fetched by
# the flake, so the checkout does not need submodules. Nothing here is
# published; the `release` workflow owns tags and releases.
#
# The three platform legs are independent matrix jobs: a slow macOS queue does
# not hold the Linux legs, and a failure on one platform does not hide the
# others (fail-fast is off; no continue-on-error).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and verify (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x86_64-linux, system: x86_64-linux, runner: ubuntu-24.04 }
          - { platform: aarch64-linux, system: aarch64-linux, runner: ubuntu-24.04-arm }
          - { platform: aarch64-darwin, system: aarch64-darwin, runner: macos-15 }
    steps:
      # The Rust toolchain, Wasmtime and the Cargo builds do not fit in the
      # free space of the Linux runner.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google \
            /usr/local/share/chromium /usr/lib/jvm
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true

      # The store paths built by a run are exported and kept in the Actions
      # cache, keyed by platform: the three systems never share an entry.
      - name: Restore the Nix store cache
        id: nix-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/nix-store-cache
          key: nix-store-${{ matrix.platform }}-${{ github.sha }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ matrix.platform }}-${{ github.sha }}-
            nix-store-${{ matrix.platform }}-
      - name: Import the cached store paths
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/nix-store-cache/store.nar ]; then
            nix-store --import < /tmp/nix-store-cache/store.nar
          fi

      - name: Show the machine and the flake outputs
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          nix --version
          nix flake show

      - name: Build i from source
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          nix build --print-out-paths --out-link result-i .#packages.${{ matrix.system }}.i -L | tee i-path
          elapsed=$(( $(date +%s) - start ))
          echo "build .#i: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          ./result-i/bin/i --version

      # Independent evidence for Darwin: the compiler must link only the
      # system libraries, never a path in the Nix store.
      - name: Check the Darwin dependencies of i
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          otool -L result-i/bin/i | tee otool-i.txt
          deps=$(tail -n +2 otool-i.txt | awk '{print $1}')
          bad=$(echo "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "i links non-system libraries:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Run a package with the compiler that was built
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          # `i new` names the newest `stdlib-vX.Y.Z` of the language's
          # repository; a local repository made from this checkout's
          # `stdlib/` stands in for it, so the library is the one tested here.
          ILANG_GIT_URLS=$("$GITHUB_WORKSPACE/scripts/dev-library-repo" "$GITHUB_WORKSPACE/stdlib" "$RUNNER_TEMP/git")
          export ILANG_GIT_URLS
          cd "$RUNNER_TEMP"
          i="$GITHUB_WORKSPACE/result-i/bin/i"
          "$i" --version
          "$i" new demo
          output=$("$i" run --project demo)
          test "$output" = "Hello, demo!"
          echo "i new + i run: $output"

      # The standard library's own tests, at the cheapest optimization level.
      # These exercise the platform paths (files, processes) that the compiler
      # smoke test does not. A failure fails this platform leg.
      - name: Test the standard library
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          cd "$GITHUB_WORKSPACE"
          start=$(date +%s)
          ./result-i/bin/i test --project stdlib --opt 0
          echo "stdlib tests (--opt 0): $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      # `i-bin` needs an archive. This run has no published release, so build
      # the archive the release workflow would upload for this platform, pin
      # it in nix/release.nix, and then build `.#i-bin` through the real
      # fetchurl path (the fixed output is already in the store, so nothing is
      # downloaded; a wrong hash would go to the release URL and fail).
      - name: Package the archive and verify i-bin installs it
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#packages.${{ matrix.system }}.i.version)
          python3 nix/package.py \
            --binary result-i/bin/i \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --output dist
          archive=$(ls "dist/i-$version-${{ matrix.platform }}.tar.gz")
          name=$(basename "$archive")
          hash=$(nix hash file --type sha256 --sri "$archive")
          nix store add-file "$archive" >/dev/null
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$name"
          echo "archive: $url ($hash)" | tee -a "$GITHUB_STEP_SUMMARY"

          cat > nix/release.nix <<EOF
          {
            artifacts = {
              ${{ matrix.system }} = {
                version = "$version";
                url = "$url";
                hash = "$hash";
              };
            };
          }
          EOF

          start=$(date +%s)
          nix build --print-out-paths --out-link result-i-bin .#packages.${{ matrix.system }}.i-bin -L | tee ibin-path
          echo "build .#i-bin: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          ./result-i-bin/bin/i --version
          test "$(./result-i-bin/bin/i --version)" = "$(./result-i/bin/i --version)"
          echo "i and i-bin report the same version: $(./result-i/bin/i --version)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the Darwin dependencies of i-bin
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          otool -L result-i-bin/bin/i | tee otool-i-bin.txt
          deps=$(tail -n +2 otool-i-bin.txt | awk '{print $1}')
          bad=$(echo "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "i-bin links non-system libraries:" >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Run both packages through nix run
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#packages.${{ matrix.system }}.i.version)
          test "$(nix run .#packages.${{ matrix.system }}.i -- --version)" = "i $version"
          test "$(nix run .#packages.${{ matrix.system }}.i-bin -- --version)" = "i $version"

      # With the archive pinned above, this also builds and runs the
      # same-version check on this platform.
      - name: Check the flake
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          nix flake check -L
          echo "nix flake check: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-${{ matrix.platform }}
          path: dist/i-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Export the Nix store for the cache
        if: success() && steps.nix-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nix-store-cache
          nix-store --export $(nix-store -qR "$(cat i-path)" "$(cat ibin-path)") \
            > /tmp/nix-store-cache/store.nar
          du -h /tmp/nix-store-cache/store.nar
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: success() && steps.nix-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/nix-store-cache
          key: nix-store-${{ matrix.platform }}-${{ github.sha }}-${{ hashFiles('flake.lock') }}
