name: Nix

# The flake installation path: `packages.i` built from source, and
# `packages.i-bin` installed from a prebuilt archive. Binaryen is fetched by
# the flake, so the checkout does not need submodules. Nothing here is
# published; the `release` workflow owns tags and releases.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: build and verify (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # The Rust toolchain, Wasmtime and the Cargo builds do not fit in the
      # free space of the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google \
            /usr/local/share/chromium /usr/lib/jvm
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true

      # The store paths built by a run are exported and kept in the Actions
      # cache. On the next run (the same commit, or after a rebase) they are
      # imported before the build, so `nix build` only does the work whose
      # inputs changed. An exact hit makes the build below a no-op.
      - name: Restore the Nix store cache
        id: nix-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/nix-store-cache
          key: nix-store-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-store-${{ runner.os }}-${{ github.sha }}-
            nix-store-${{ runner.os }}-
      - name: Import the cached store paths
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/nix-store-cache/store.nar ]; then
            nix-store --import < /tmp/nix-store-cache/store.nar
          fi

      - name: Show the flake outputs
        run: nix flake show

      - name: Build i from source
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          nix build --print-out-paths --out-link result-i .#i -L | tee i-path
          elapsed=$(( $(date +%s) - start ))
          echo "build .#i: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
          ./result-i/bin/i --version

      - name: Show the runtime closure of i
        shell: bash
        run: |
          set -euo pipefail
          nix-store -qR ./result-i | sed 's|/nix/store/[a-z0-9]*-||' | sort > closure.txt
          echo "runtime closure: $(wc -l < closure.txt) paths" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "toolchain-like paths:"
          grep -E 'rustc|rust-std|cargo|rust-analyzer|rust-src|gcc-wrapper|binutils' closure.txt || true
          rustc_path=$(nix-store -qR ./result-i | grep -m1 -- '-rustc-' || true)
          if [ -n "$rustc_path" ]; then
            nix why-depends ./result-i "$rustc_path" || true
          fi

      - name: Run a package with the compiler that was built
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          i="$GITHUB_WORKSPACE/result-i/bin/i"
          "$i" --version
          "$i" new demo
          output=$("$i" run --project demo)
          test "$output" = "Hello, demo!"
          echo "i new + i run: $output"

      # `i-bin` needs an archive. This run has no published release, so build
      # the same archive the release workflow would upload, pin it in
      # nix/release.nix, and then build `.#i-bin` through the production path.
      - name: Package the archive and verify i-bin installs it
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#packages.x86_64-linux.i.version)
          python3 nix/package.py \
            --binary result-i/bin/i \
            --version "$version" \
            --platform x86_64-linux \
            --output dist
          archive=$(ls dist/i-*.tar.gz)
          name=$(basename "$archive")
          hash=$(nix hash file --type sha256 --sri "$archive")
          # The fetchurl output path is the hash and the file name, so adding
          # the file to the store lets Nix resolve the url below without a
          # download. A published release resolves it from GitHub instead.
          nix store add-file "$archive" >/dev/null
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/$name"
          echo "archive: $url ($hash)" | tee -a "$GITHUB_STEP_SUMMARY"

          # Pin the archive exactly as a published one is pinned, then install
          # it through the same fetchurl path a user gets.
          cat > nix/release.nix <<EOF
          {
            artifacts = {
              x86_64-linux = {
                version = "$version";
                url = "$url";
                hash = "$hash";
              };
            };
          }
          EOF

          start=$(date +%s)
          nix build .#i-bin -L --out-link result-i-bin
          echo "build .#i-bin: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          ./result-i-bin/bin/i --version
          test "$(./result-i-bin/bin/i --version)" = "$(./result-i/bin/i --version)"
          echo "i and i-bin report the same version: $(./result-i/bin/i --version)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run both packages through nix run
        run: |
          test "$(nix run .#i -- --version)" = "i $(nix eval --raw .#packages.x86_64-linux.i.version)"
          test "$(nix run .#i-bin -- --version)" = "i $(nix eval --raw .#packages.x86_64-linux.i.version)"

      # With the archive pinned above, this also builds the same-version
      # check that `nix flake check` runs after a real release.
      - name: Check the flake
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          nix flake check -L
          echo "nix flake check: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-x86_64-linux
          path: dist/i-*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Export the Nix store for the cache
        if: success() && steps.nix-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nix-store-cache
          nix-store --export $(nix-store -qR "$(readlink -f result-i)" "$(readlink -f result-i-bin)") \
            > /tmp/nix-store-cache/store.nar
          du -h /tmp/nix-store-cache/store.nar
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: success() && steps.nix-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/nix-store-cache
          key: nix-store-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('flake.lock') }}
