name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'lib/**'
      - 'std/**'
      - 'docs/spec.md'
      - 'SPEC.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      I_BIN: ${{ github.workspace }}/target/debug/i
    steps:
      - name: Free disk space for the compiler build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google \
            /usr/local/share/chromium /usr/lib/jvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # This workflow has no release artifact. A dev compiler avoids release
      # optimization work; the same target also holds the snippet parser.
      - name: Build the example compiler
        run: devenv shell -- cargo build --locked -p ilang-cli
      - name: Build and check
        working-directory: docs
        run: |
          devenv shell -- npm ci
          devenv shell -- npm run build
          devenv shell -- npm run check:links
          devenv shell -- npm run check:examples
      # The Pages artifact is uploaded by the job that built and checked the site. The deploy job
      # only deploys it: an artifact uploaded in the deploy job itself is not yet visible to
      # deploy-pages.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
