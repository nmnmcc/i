name: Deploy documentation

# Deployment only. The site is built and its checks run in ci.yml (job docs,
# shard 1: npm run build, check:placeholders, check:links, check:rendering,
# and check:examples in every shard), with the release i of that run. On a
# push to main that job uploads docs/dist as the artifact docs-site; after
# the CI run of that push is green, this workflow deploys that artifact.
# Nothing is built or checked here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Deploys the site of the newest green CI run of a push to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: Stage the site of the CI run
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Find the CI run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          echo "CI run $RUN_ID"
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      # The Pages artifact is uploaded by a job before the deploy job: an
      # artifact uploaded in the deploy job itself is not yet visible to
      # deploy-pages.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
