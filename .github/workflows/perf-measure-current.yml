# One-off: measure the baseline binary that Perf baseline built, without
# waiting for the whole build matrix. Started by a push to this file.
name: Perf measure current

on:
  push:
    branches: [ci/perf-baseline]
    paths: [.github/workflows/perf-measure-current.yml]

permissions:
  contents: read

env:
  BASELINE_RUN: "44503007673"
  RAYON_NUM_THREADS: 1
  REPEATS: "3"

jobs:
  measure:
    name: measure (opt ${{ matrix.opt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        opt: [0, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a906931b9166b650f14d1d96d1100daa54fd5e51
          submodules: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf:
            always-allow-substitutes = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release-current
          path: target/release
          run-id: ${{ env.BASELINE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the libraries of i
        run: |
          chmod +x target/release/i
          xargs nix-store --realise < target/release/i.nix-paths > /dev/null
          target/release/i --version
      - name: Machine
        run: |
          mkdir -p out
          { echo "commit: $(git rev-parse HEAD)"; uname -a; nproc; lscpu; free -h; cat /proc/loadavg; } > out/machine.txt
          cat out/machine.txt
      - name: Run the benchmarks
        env:
          OPT: ${{ matrix.opt }}
        run: |
          set -x
          for r in $(seq 1 "$REPEATS"); do
            cat /proc/loadavg > "out/load-$r.txt"
            /usr/bin/time -v -o "out/time-$r.txt" \
              target/release/i test --project bench --opt "$OPT" --time \
              > "out/run-$r.log" 2> "out/stderr-$r.log"
            cat /proc/loadavg > "out/load-after-$r.txt"
            tail -5 "out/run-$r.log"
            grep -E "Maximum resident set size|User time|System time|Elapsed" "out/time-$r.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-current-o${{ matrix.opt }}-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
