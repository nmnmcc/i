# Compares std/dict.insert with a copy whose per-level result tuples are
# removed, on one runner. Started by a push to this file.
name: Perf dict probe

on:
  push:
    branches: [ci/perf-baseline]
    paths: [.github/workflows/perf-dictprobe.yml, diag/dictprobe/**]

permissions:
  contents: read

env:
  TYPED_RUN: "44564332020"
  RAYON_NUM_THREADS: 1
  REPEATS: "5"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/perf-baseline
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf:
            always-allow-substitutes = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release-typed
          path: bin/typed
          run-id: ${{ env.TYPED_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the libraries of i
        run: |
          chmod +x bin/typed/i
          xargs nix-store --realise < bin/typed/i.nix-paths > /dev/null
          bin/typed/i --version
          mkdir -p out
          { uname -a; nproc; lscpu; free -g; cat /proc/loadavg; } > out/machine.txt
          cat out/machine.txt
      - name: Alternate std and the no-result-tuple copy
        run: |
          set -x
          for r in $(seq 1 "$REPEATS"); do
            cat /proc/loadavg > "out/load-$r.txt"
            if [ $((r % 2)) -eq 1 ]; then order="std local"; else order="local std"; fi
            for b in $order; do
              bin/typed/i test --project diag/dictprobe --opt 2 --time "diag_${b}_insert" \
                > "out/run-$r-$b.log" 2> "out/stderr-$r-$b.log"
              grep -hE "^pass|^FAIL" "out/run-$r-$b.log"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-dictprobe-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
