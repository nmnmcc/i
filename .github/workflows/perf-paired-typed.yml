# Paired comparison of main and type-directed equality, on one runner.
name: Perf paired typed

on:
  push:
    branches: [ci/perf-baseline]
    paths: [.github/workflows/perf-paired-typed.yml]

permissions:
  contents: read

env:
  BASE_RUN: "44538926082"
  TYPED_RUN: "44564332020"
  RAYON_NUM_THREADS: 1
  REPEATS: "5"

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/perf-baseline
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf:
            always-allow-substitutes = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release-eq
          path: bin/base
          run-id: ${{ env.BASE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release-typed
          path: bin/typed
          run-id: ${{ env.TYPED_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the libraries of both binaries
        run: |
          for b in base typed; do
            chmod +x "bin/$b/i"
            xargs nix-store --realise < "bin/$b/i.nix-paths" > /dev/null
            "bin/$b/i" --version
          done
          mkdir -p out
          { uname -a; nproc; lscpu; free -g; cat /proc/loadavg; } > out/machine.txt
          cat out/machine.txt
      - name: Alternate the two binaries
        run: |
          set -x
          for r in $(seq 1 "$REPEATS"); do
            if [ $((r % 2)) -eq 1 ]; then order="base typed"; else order="typed base"; fi
            for b in $order; do
              cat /proc/loadavg > "out/load-$r-$b.txt"
              /usr/bin/time -v -o "out/time-$r-$b.txt" \
                "bin/$b/i" test --project bench --opt 2 --time \
                > "out/run-$r-$b.log" 2> "out/stderr-$r-$b.log"
              grep -hE "^pass bench/bench_test" "out/run-$r-$b.log"
            done
          done
      - name: Equality probes, three rounds each
        run: |
          for r in 1 2 3; do
            if [ $((r % 2)) -eq 1 ]; then order="base typed"; else order="typed base"; fi
            for b in $order; do
              "bin/$b/i" test --project bench --opt 2 --time diag_equal \
                > "out/diag-$r-$b.log" 2> "out/diag-$r-$b.err"
              grep -hE "^pass bench/diag2_test" "out/diag-$r-$b.log" || true
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-paired-typed-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14
