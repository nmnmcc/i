name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The parts of scripts/dev-verify, which run at the same time.
        part: [rust, i, js]
    steps:
      # The Rust toolchain, Wasmtime and the Cargo builds do not fit in the
      # free space of the runner, so take out preinstalled tools not used here.
      - name: Free disk space
        if: matrix.part != 'js'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google \
            /usr/local/share/chromium /usr/lib/jvm
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ matrix.part != 'js' }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # devenv 2.4.0, prebuilt in the binary cache of nixpkgs.
      - name: Install devenv
        run: nix profile install nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.part != 'js'
        with:
          key: ${{ matrix.part }}
          # Run rustc and cargo of the Devenv shell, not those of the runner.
          cmd-format: devenv shell -- {0}
          # Only main writes the cache, so that it stays small; every branch reads it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify ${{ matrix.part }}
        run: devenv shell -- ./scripts/dev-verify ${{ matrix.part }}
      - name: Keep the browser test results
        if: always() && matrix.part == 'js'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.run_id }}
          path: |
            target/browser
            test-results
            playwright-report
          retention-days: 14
