name: CI

on:
  # The daily run is the full gate, with both optimisation levels of spec.
  schedule:
    - cron: '0 3 * * *'
  # Pull requests run the gate; a push to main runs it again, on the merged
  # tree. Feature branches do not start a second run of their own.
  push:
    branches: [main, redesign]
  pull_request:
  workflow_dispatch:
    inputs:
      levels:
        description: 'Optimisation levels (0, or 0,2); empty follows the event'
        default: ''

permissions:
  contents: read

# One group per branch, plus main and schedule on their own. A newer commit on
# a branch cancels that branch's older run; another branch can never cancel it,
# so every pull request can still reach a finished gate. Main is never
# cancelled (it deploys), and the daily run is never cancelled either.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || (github.event_name == 'schedule' && 'schedule' || format('branch-{0}', github.head_ref || github.ref_name)) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  # No debug information in the dev and test builds (smaller target, faster
  # links), and no incremental state, which a fresh runner cannot reuse.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

# Each job is named by what it runs: build, lint, test, run, corpus or docs.
#
#   changes   which inputs a pull request changes (scripts/ci/changes): the
#             path filters rust, docs and editors. Every other event sets all
#             three, so a push (main included) always runs the full gate.
#   plan      the shards of every sharded job, from the measured costs in
#             ci/costs.json (scripts/ci/plan, which runs ilang-shard), and the
#             list of jobs this run must have (expected.json).
#   summary   the one required check (scripts/ci/summary): every job the plan
#             expects left its marker, no other job did, and no job failed or
#             was cancelled. Each job's last step uploads its marker
#             (.github/actions/marker); a job added here needs an entry in
#             JOBS of scripts/ci/plan and in the summary's needs.
#
# Path filters, on pull requests only (see scripts/ci/changes):
#   rust     a file outside docs/ and editors/, or docs/spec.md: the release
#            build, the Rust and JavaScript tests, i, corpus and docs.
#   docs     docs/, lib/ or stdlib/: the release build and docs.
#   editors  editors/, lib/, stdlib/ or examples/: the editor checks.
#   A change to .github/, ci/, scripts/ci/, scripts/checks or the Devenv files
#   sets all three. lint always runs (on a change without rust, only its
#   snippet check, which reads every .md and .mdx file).
#
# The release `i` is built once, in `release`; std, std_workers, corpus and
# docs download it. The Rust tests are sharded by test binary (CHECKS_TEST_GROUP=targets
# and CHECKS_TEST_TARGETS, words `<crate>:<key>` of the cost table), the
# spec suite, value types, the corpus and the site examples by k/N
# (I_SPEC_SHARD, VALUE_TYPES_SHARD and VALUE_TYPES_SHARD_OF, CHECKS_SHARD).
# Every matrix job runs at most plan.outputs.max_parallel (18, set in
# scripts/ci/plan) of its shards at once.
#
# No job frees disk space any more: the step that deleted the runner's
# preinstalled tools (about a minute per job) is gone from every job. This
# stands once three runs in a row are green, one of them with the release
# build. Roll back (restore the step, in the failing job only) when a job
# fails with "No space left on device".
#
# Swatinem/rust-cache keeps the built dependencies and the ccache objects of
# Binaryen, by job and Cargo.lock. Pushes to main, redesign and ci/** write it;
# a run reads the caches of its own branch, of main and, for a pull request, of
# its base branch (GitHub's cache scoping).

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch: the diff of the two is what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Classify the changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/paths"
          else
            : > "$RUNNER_TEMP/paths"
          fi
          python3 -I scripts/ci/changes --event "$EVENT" --github-output "$GITHUB_OUTPUT" < "$RUNNER_TEMP/paths"
      - uses: ./.github/actions/marker
        with:
          name: changes
          id: ${{ github.job }}-${{ strategy.job-index }}

  plan:
    name: plan
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      changed: ${{ steps.plan.outputs.changed }}
      check_tests: ${{ steps.plan.outputs.check_tests }}
      value_types: ${{ steps.plan.outputs.value_types }}
      cli_tests: ${{ steps.plan.outputs.cli_tests }}
      spec: ${{ steps.plan.outputs.spec }}
      corpus: ${{ steps.plan.outputs.corpus }}
      std: ${{ steps.plan.outputs.std }}
      std_workers: ${{ steps.plan.outputs.std_workers }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - name: Note the start
        run: echo "PLAN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's rustup, with the toolchain of rust-toolchain.toml.
      - name: Set up Rust
        run: |
          rustup toolchain install
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: plan-${{ hashFiles('Cargo.lock') }}
          save-if: true
      # A failing ilang-shard command fails this job, and with it the run:
      # no matrix is ever empty.
      - name: Plan the shards
        id: plan
        env:
          CHANGED: ${{ needs.changes.outputs.changed }}
        run: python3 -I scripts/ci/plan --changed "$CHANGED" --out "$RUNNER_TEMP/plan" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan/expected.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - name: Record the wall time
        run: |
          seconds=$(( $(date +%s) - PLAN_STARTED ))
          echo "plan: ${seconds} s from checkout to the expected list"
          echo "plan job: ${seconds} s (checkout, toolchain, ilang-shard build, plan)" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/marker
        with:
          name: plan
          id: ${{ github.job }}-${{ strategy.job-index }}

  release:
    name: build (release i)
    needs: changes
    if: fromJSON(needs.changes.outputs.changed).rust || fromJSON(needs.changes.outputs.changed).docs || fromJSON(needs.changes.outputs.changed).editors
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Take paths that were built here before, such as the Rust toolchain
          # of rust-overlay, from the cache instead of building them again.
          extra-conf: |
            always-allow-substitutes = true
      # Keeps the Nix store paths built in CI in the GitHub Actions cache. Only
      # the Actions cache is used, not FlakeHub, and the daemon is pinned.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      # devenv 2.4.0, prebuilt in the binary cache of nixpkgs.
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ hashFiles('Cargo.lock') }}
          # Run rustc and cargo of the Devenv shell, not those of the runner.
          cmd-format: devenv shell -- {0}
          # The objects of Binaryen's C++ (see CMAKE_CXX_COMPILER_LAUNCHER in
          # devenv.nix).
          cache-directories: ~/.cache/ccache
          # main and the long-lived work branches write the cache; every branch
          # reads it.
          save-if: true
      - name: Build the release i
        run: |
          devenv shell -- cargo build --release --locked -p ilang-cli
          df -h /
      # The first step that reads types, so a library type error is reported
      # about four minutes into the run, not after the long i job.
      - name: Type check the standard library
        run: devenv shell -- ./target/release/i check --project stdlib
      # The binary is linked against glibc and libstdc++ of the Nix store. The
      # jobs that only run it fetch these store paths instead of the whole
      # Devenv shell.
      - name: List the Nix store paths that i loads
        run: |
          devenv shell -- ldd target/release/i \
            | grep -o '/nix/store/[a-z0-9]\{32\}-[^/ ]*' | sort -u > target/release/i.nix-paths
          cat target/release/i.nix-paths
          test -s target/release/i.nix-paths
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-release
          path: |
            target/release/i
            target/release/i.nix-paths
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - uses: ./.github/actions/marker
        with:
          name: build (release i)
          id: ${{ github.job }}-${{ strategy.job-index }}

  # The Rust lint and every crate but ilang-check and ilang-cli, whose tests
  # are sharded below. The lint runs only on a Rust change (or the snippets,
  # which read the .md files); the tests only on a Rust change.
  misc:
    name: lint and test (rust, other crates)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECKS_TEST_GROUP: rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-rest-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: true
      - name: Run the Rust lint
        if: fromJSON(needs.changes.outputs.changed).rust || fromJSON(needs.changes.outputs.changed).docs
        env:
          PART: ${{ fromJSON(needs.changes.outputs.changed).rust && 'rust-lint' || 'snippets' }}
        run: devenv shell -- ./scripts/checks "$PART"
      - name: Run the Rust tests
        if: fromJSON(needs.changes.outputs.changed).rust
        run: devenv shell -- ./scripts/checks rust-test
      # The deterministic TLS test five times, so a flake shows up here rather
      # than in a release.
      - name: Repeat the local TLS test
        if: fromJSON(needs.changes.outputs.changed).rust
        run: |
          for run in 1 2 3 4 5; do
            if ! devenv shell -- cargo test -p ilang-cli --locked --test tls -- --test-threads=1; then
              echo "local TLS run $run of 5 failed" >&2
              exit 1
            fi
          done
      - uses: ./.github/actions/marker
        with:
          name: lint and test (rust, other crates)
          id: ${{ github.job }}-${{ strategy.job-index }}

  # ilang-check's test binaries but value_types, in the shards of the plan
  # (set ilang-check-tests).
  check_tests:
    name: ${{ matrix.display }}
    needs: plan
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.check_tests) }}
    env:
      CHECKS_TEST_GROUP: targets
      CHECKS_TEST_TARGETS: ${{ matrix.targets }}
      CHECKS_SHARD: ${{ matrix.shard }}
      CHECKS_NETWORK_TESTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The shards build the same crate, so they share one cache; the
          # first shard writes it.
          key: test-check-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: true
      - name: Run the Rust tests
        run: devenv shell -- ./scripts/checks rust-test
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # ilang-check's value_types, sharded by case (set value-type-cases).
  value_types:
    name: ${{ matrix.display }}
    needs: plan
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.value_types) }}
    env:
      CHECKS_TEST_GROUP: targets
      CHECKS_TEST_TARGETS: ${{ matrix.targets }}
      CHECKS_SHARD: ${{ matrix.shard }}
      # 0-based shard index of N; the test plans the cases from ci/costs.json.
      VALUE_TYPES_SHARD: ${{ matrix.index }}
      VALUE_TYPES_SHARD_OF: ${{ matrix.of }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-value-types-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: true
      - name: Run the Rust tests
        env:
          CHECKS_TIMINGS: ${{ runner.temp }}/timings.jsonl
        run: devenv shell -- ./scripts/checks rust-test
      - name: Keep the case timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-value-types-${{ strategy.job-index }}
          path: ${{ runner.temp }}/timings.jsonl
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # ilang-cli's test binaries but spec, in the shards of the plan (set
  # ilang-cli-tests).
  cli_tests:
    name: ${{ matrix.display }}
    needs: plan
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cli_tests) }}
    env:
      CHECKS_TEST_GROUP: targets
      CHECKS_TEST_TARGETS: ${{ matrix.targets }}
      CHECKS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-cli-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: true
      - name: Run the Rust tests
        run: devenv shell -- ./scripts/checks rust-test
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # The spec suite (ilang-cli --test spec), k/N of its cases per shard; N
  # from the plan (set spec-cases). The group spec-K/N of scripts/checks.
  spec:
    name: ${{ matrix.display }}
    needs: plan
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.spec) }}
    env:
      CHECKS_TEST_GROUP: spec-${{ matrix.shard }}
      I_SPEC_SHARD: ${{ matrix.shard }}
      # The push/PR gate runs O0; the daily run compares O0 and O2.
      CHECKS_SPEC_LEVELS: ${{ inputs.levels != '' && inputs.levels || (github.event_name == 'schedule' && '0,2' || '0') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-spec-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: true
      - name: Run the spec suite
        env:
          CHECKS_TIMINGS: ${{ runner.temp }}/timings.jsonl
        run: devenv shell -- ./scripts/checks rust-test
      - name: Keep the case timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-spec-${{ strategy.job-index }}
          path: ${{ runner.temp }}/timings.jsonl
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # The JavaScript SDK and browser tests, the editor support, and the
  # documentation site, which reuses the release i of job `release`. One job
  # so that the plan needs one marker and the concurrency slots stay for the
  # shards that carry the long work.
  web:
    name: test (javascript, editors, docs)
    needs: [changes, release]
    if: fromJSON(needs.changes.outputs.changed).rust || fromJSON(needs.changes.outputs.changed).docs || fromJSON(needs.changes.outputs.changed).editors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      I_BIN: ${{ github.workspace }}/target/release/i
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-tags: true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-${{ hashFiles('Cargo.lock') }}
          cmd-format: devenv shell -- {0}
          cache-directories: ~/.cache/ccache
          save-if: true
      - name: Run the JavaScript tests
        if: fromJSON(needs.changes.outputs.changed).rust
        run: devenv shell -- ./scripts/checks js
      - name: Keep the browser test results
        if: always() && fromJSON(needs.changes.outputs.changed).rust
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.run_id }}
          path: target/browser
          overwrite: true
          retention-days: 14
      - name: Run the editor checks
        if: fromJSON(needs.changes.outputs.changed).editors
        run: devenv shell -- ./scripts/checks editors
      # The release i, for the documentation examples.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: fromJSON(needs.changes.outputs.changed).docs
        with:
          name: i-release
          path: target/release
      - name: Prepare the example compiler
        if: fromJSON(needs.changes.outputs.changed).docs
        run: |
          chmod +x target/release/i
          ./scripts/ci/retry sh -c 'xargs nix-store --realise < target/release/i.nix-paths > /dev/null'
          target/release/i --version
      - name: Install the site's packages
        if: fromJSON(needs.changes.outputs.changed).docs
        working-directory: docs
        run: devenv shell -- npm ci
      - name: Build the site and run the site checks
        if: fromJSON(needs.changes.outputs.changed).docs
        working-directory: docs
        run: |
          devenv shell -- npm run build
          devenv shell -- npm run check:placeholders
          devenv shell -- npm run check:links
          devenv shell -- npm run check:rendering
      - name: Run the documentation examples
        if: fromJSON(needs.changes.outputs.changed).docs
        working-directory: docs
        run: devenv shell -- npm run check:examples
      - name: Keep the site for deployment
        if: fromJSON(needs.changes.outputs.changed).docs && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - uses: ./.github/actions/marker
        with:
          name: test (javascript, editors, docs)
          id: ${{ github.job }}-${{ strategy.job-index }}

  # `scripts/checks i` with the release i and without the review corpus,
  # which the job `corpus` runs. Each shard is meant to run the projects of
  # its plan entry (CHECKS_I_PROJECTS: keys <project>@<opt> of set
  # std-tests, space-separated) and shard 1 the parts of `i` that are not
  # projects (CHECKS_I_SHARD=K/N). Until scripts/checks reads these two, each
  # shard runs the whole `i` part. (CHECKS_SHARD is the corpus shard there,
  # so it is not set here.)
  std:
    name: ${{ matrix.display }}
    needs: [plan, release]
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.std) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release
          path: target/release
      # Artifacts do not keep the file mode.
      - name: Make i executable
        run: chmod +x target/release/i
      - name: Run i end to end
        env:
          CHECKS_I_BINARY: target/release/i
          CHECKS_SKIP_CORPUS: 1
          CHECKS_I_PROJECTS: ${{ matrix.projects }}
          CHECKS_I_SHARD: ${{ matrix.shard }}
        run: devenv shell -- ./scripts/checks i
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # `scripts/checks i` at the worker count of `i run` (the product default):
  # `i test --workers auto` is the switch from #64. Each shard runs the
  # projects of its plan entry (CHECKS_I_PROJECTS: keys <project>@<opt> of set
  # std-worker-tests). Shard 1 also runs the non-project parts, as in `std`,
  # because CHECKS_I_SHARD is set.
  std_workers:
    name: ${{ matrix.display }}
    needs: [plan, release]
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.std_workers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Install devenv
        run: ./scripts/ci/retry nix profile install github:NixOS/nixpkgs/e513db7b0a65def6f6e17bb55195dfe510871944#devenv
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release
          path: target/release
      # Artifacts do not keep the file mode.
      - name: Make i executable
        run: chmod +x target/release/i
      - name: Run i end to end
        env:
          CHECKS_I_BINARY: target/release/i
          CHECKS_SKIP_CORPUS: 1
          CHECKS_I_PROJECTS: ${{ matrix.projects }}
          CHECKS_I_SHARD: ${{ matrix.shard }}
          CHECKS_I_WORKERS: auto
        run: devenv shell -- ./scripts/checks i
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # The review corpus, k/N of its cases per shard; N from the plan (set
  # corpus-cases).
  corpus:
    name: ${{ matrix.display }}
    needs: [plan, release]
    if: fromJSON(needs.plan.outputs.changed).rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.corpus) }}
    env:
      CHECKS_SHARD: ${{ matrix.shard }}
      CHECKS_CORPUS_LEVELS: ${{ inputs.levels != '' && inputs.levels || (github.event_name == 'schedule' && '0,2' || '0') }}
      # One thread per i process; the runner's four cores run four cases.
      RAYON_NUM_THREADS: 1
      # The runner's cores are slower than the machine the expectations were recorded on.
      CORPUS_BOUND_SCALE: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: i-release
          path: target/release
      # The corpus needs only i and Python 3.11 or later (the runner's
      # python3), so fetch the libraries i loads, not the Devenv shell.
      - name: Fetch the libraries of i
        run: |
          chmod +x target/release/i
          ./scripts/ci/retry sh -c 'xargs nix-store --realise < target/release/i.nix-paths > /dev/null'
          target/release/i --version
          python3 --version
      - name: Review corpus, shard ${{ matrix.shard }}
        env:
          CHECKS_TIMINGS: ${{ runner.temp }}/timings.jsonl
        run: ./scripts/review-corpus run --binary target/release/i --shard "$CHECKS_SHARD" --jobs 4
      - name: Keep the case timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-corpus-${{ matrix.index }}
          path: ${{ runner.temp }}/timings.jsonl
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3
      - name: Keep the changed observations
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-actual-${{ matrix.k }}-${{ github.run_id }}
          path: tests/review/cases/**/actual.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - uses: ./.github/actions/marker
        with:
          name: ${{ matrix.display }}
          id: ${{ github.job }}-${{ strategy.job-index }}

  # The one required check. See the comment at the top and scripts/ci/summary.
  summary:
    name: summary (required)
    needs: [changes, plan, release, misc, check_tests, value_types, cli_tests, spec, std, std_workers, corpus, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      # Missing when the plan job failed; the summary then fails and says so.
      - name: Download the expected list
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Download the markers
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: marker-*
          merge-multiple: true
          path: ${{ runner.temp }}/markers
      - name: Compare the jobs with the plan
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: ${{ runner.temp }}/plan/expected.json
          MARKERS: ${{ runner.temp }}/markers
        run: python3 -I scripts/ci/summary --expected "$EXPECTED" --markers "$MARKERS"
