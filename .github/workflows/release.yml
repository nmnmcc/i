# Builds `i` with Nix for every platform of the matrix, packages it as the
# archive that `packages.<system>.i-bin` installs, and checks that archive end
# to end through the `i-bin` package.
#
# Pushing a `v*` tag is the only way to publish: only then does the `publish`
# job run and create (or update) the GitHub release. Pull-request runs are dry
# runs; they build, package, verify and upload Actions artifacts, nothing more.
#
# After a successful tag run, copy the entries of the `i-bin-fragment`
# artifact (also shown in the run summary) into `nix/release.nix`.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/i.nix'
      - 'nix/i-bin.nix'
      - 'nix/package.py'
      - 'nix/release.nix'
  workflow_dispatch:

# Read only for the build jobs; `publish` raises it for the tag run.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # A cold store builds Python, CMake, LLVM and rustc from source for the
    # toolchain (a change low in the closure, such as `tzdata` below, reaches
    # all of them). The store is cached between runs, so only the first run
    # after such a change pays for it; the ceiling is GitHub's.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Adding a platform is adding an entry to the NIX_RELEASE_MATRIX
      # repository variable (JSON, same keys); the default is all three
      # supported platforms. An entry needs a runner in this repository's
      # configuration.
      matrix:
        include: ${{ fromJSON(vars.NIX_RELEASE_MATRIX || '[{"platform":"x86_64-linux","system":"x86_64-linux","runner":"ubuntu-24.04"},{"platform":"aarch64-linux","system":"aarch64-linux","runner":"ubuntu-24.04-arm"},{"platform":"aarch64-darwin","system":"aarch64-darwin","runner":"macos-15"}]') }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google \
            /usr/local/share/chromium /usr/lib/jvm
          df -h /
      # Binaryen is fetched by Nix, not from the submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Read the version
        run: echo "VERSION=$(nix eval --raw .#packages.${{ matrix.system }}.i.version)" >> "$GITHUB_ENV"
      - name: Build i
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          out=$(nix build --print-out-paths .#packages.${{ matrix.system }}.i -L)
          ln -sfn "$out" result-i
          echo "Built \`i\` $VERSION for ${{ matrix.platform }} in $(( $(date +%s) - start )) s." >> "$GITHUB_STEP_SUMMARY"
      # Independent evidence for Darwin: only system libraries, no store
      # paths. This is what decides whether i-bin can be installed elsewhere.
      - name: Check the Darwin dependencies of i
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          otool -L result-i/bin/i | tee otool-i.txt
          deps=$(tail -n +2 otool-i.txt | awk '{print $1}')
          bad=$(echo "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "i links non-system libraries:" >&2
            echo "$bad" >&2
            exit 1
          fi
      # Independent evidence for Linux: a static musl binary names no
      # interpreter, no shared library and no RPATH, so nothing in it can
      # resolve through this machine's store. v0.1.0 passed every other check
      # here and still could not start without `/nix`.
      - name: Check the Linux dependencies of i
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          file result-i/bin/i
          if readelf -l result-i/bin/i | grep 'Requesting program interpreter'; then
            echo "i names an ELF interpreter; it will not start without it" >&2
            exit 1
          fi
          # `ldd` exits 1 for a file it cannot load as dynamic, which a static
          # binary is; the text is what matters.
          ldd result-i/bin/i > ldd-i.txt 2>&1 || true
          cat ldd-i.txt
          case "$(cat ldd-i.txt)" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "i is a dynamic executable (see ldd-i.txt)" >&2; exit 1 ;;
          esac
          if objdump -p result-i/bin/i | grep -E '^[[:space:]]+(NEEDED|RPATH|RUNPATH)'; then
            echo "i needs shared libraries or carries an RPATH" >&2
            exit 1
          fi
          # Strings are not loads; list them anyway. A store path among them
          # is what would tie the archive to the machine that built it.
          strings -a result-i/bin/i | grep -E '^/(nix/store|build)/' | sort -u > build-paths-i.txt || true
          {
            echo "### Paths of the build machine in \`i\` (${{ matrix.platform }})"
            echo '```'
            cat build-paths-i.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Rust's std panic locations are remapped to `/nix/store/eeee…`,
          # a prefix that is not a real store path; anything else is.
          stored=$(grep '^/nix/store/' build-paths-i.txt | grep -v '^/nix/store/eeee' || true)
          if [ -n "$stored" ]; then
            echo "i names store paths:" >&2
            echo "$stored" >&2
            exit 1
          fi
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          i="$PWD/result-i/bin/i"
          test "$("$i" --version)" = "i $VERSION"
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/home"
          cd "$work"
          export HOME="$work/home"
          "$i" new demo
          out=$("$i" run --project demo)
          echo "$out"
          test "$out" = "Hello, demo!"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          python3 nix/package.py --binary result-i/bin/i --version "$VERSION" \
            --platform "${{ matrix.platform }}" --output dist | tee package.out
          name=$(sed -n 's/^url-name: //p' package.out)
          sri=$(sed -n 's/^hash: //p' package.out)
          mkdir -p checksums
          (cd dist && shasum -a 256 "$name") > "checksums/$name.sha256"
          # Tag runs publish under the pushed tag; dry runs show the tag a release would use.
          if [ "${{ github.ref_type }}" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$name"
          printf 'version=%s\nurl=%s\nhash=%s\n' "$VERSION" "$url" "$sri" > "dist/i-bin-${{ matrix.platform }}.txt"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "URL=$url" >> "$GITHUB_ENV"
          { echo "### ${{ matrix.platform }}"; echo '```'; cat "dist/i-bin-${{ matrix.platform }}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The archive has to run on a machine that has no Nix at all. This is
      # the only step that would have caught v0.1.0: `nix build` and the
      # `i-bin` install pass on a machine with `/nix` whatever the archive
      # names as its loader. No continue-on-error; a failure fails the run,
      # and `publish` needs this job.
      - name: Run the archive in a container without Nix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/archive"
          mkdir -p "$extracted"
          tar -xzf "dist/$NAME" -C "$extracted"
          test -x "$extracted/bin/i"
          # debian:stable-slim has no git, and `i new` resolves the newest
          # `stdlib-vX.Y.Z` through it. A dry run's tag is not published, so
          # serve the library from this checkout over a mounted repository.
          library="$RUNNER_TEMP/library"
          rm -rf "$library"
          cp -a stdlib "$library"
          chmod -R u+w "$library"
          git -C "$library" init -q
          git -C "$library" -c user.email=i@example.invalid -c user.name=i add -A
          git -C "$library" -c user.email=i@example.invalid -c user.name=i commit -qm "library $VERSION"
          git -C "$library" -c user.email=i@example.invalid -c user.name=i tag "stdlib-v$VERSION"
          docker run --rm \
            -v "$extracted:/d:ro" \
            -v "$library:/library:ro" \
            -e "ILANG_GIT_URLS=github.com/nmnmcc/i=file:///library" \
            -e "VERSION=$VERSION" \
            debian:stable-slim sh -c '
              set -eu
              export DEBIAN_FRONTEND=noninteractive
              export PATH="/d/bin:$PATH"
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git >/dev/null 2>&1
              # The mounts belong to the runner user; the container is root.
              git config --global --add safe.directory "*"
              test "$(i --version)" = "i $VERSION"
              cd /tmp
              i new demo
              cd demo
              out=$(i run)
              test "$out" = "Hello, demo!"
              # The native executable `i build` writes embeds the runner the
              # compiler carries, so it has to run here too.
              i build >/dev/null
              test "$(./build/demo)" = "Hello, demo!"
              echo "$out"
            '
          echo "The archive ran in a container without Nix." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the archive as i-bin
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$extracted"
          tar -xzf "dist/$NAME" -C "$extracted"
          test "$("$extracted/bin/i" --version)" = "i $VERSION"
          # The fetchurl output path is the hash and the file name, so the
          # add-file copy resolves the release url without a download.
          nix store add-file "dist/$NAME" >/dev/null
          sri=$(nix hash file --type sha256 --sri "dist/$NAME")
          grep -qx "hash=$sri" "dist/i-bin-${{ matrix.platform }}.txt"
          # --impure only for builtins.getFlake on the local checkout.
          nix build --impure -L --out-link result-i-bin --expr "let f = builtins.getFlake (toString ./.); in (f.packages.\"${{ matrix.system }}\".i-bin).override { artifact = { version = \"$VERSION\"; url = \"$URL\"; hash = \"$sri\"; }; }"
          test "$(./result-i-bin/bin/i --version)" = "i $VERSION"
          test "$(./result-i-bin/bin/i --version)" = "$(./result-i/bin/i --version)"
      - name: Check the Darwin dependencies of i-bin
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          otool -L result-i-bin/bin/i | tee otool-i-bin.txt
          deps=$(tail -n +2 otool-i-bin.txt | awk '{print $1}')
          bad=$(echo "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "i-bin links non-system libraries:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-${{ matrix.platform }}
          path: |
            dist/i-*-${{ matrix.platform }}.tar.gz
            dist/i-bin-${{ matrix.platform }}.txt
            checksums/i-*-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Runs after every build leg succeeded; a failed build must not publish a
    # partial release.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      # The artifacts hold dist/ and checksums/, so they are merged into the workspace root.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: i-*
          merge-multiple: true
          path: .
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist checksums
          # The tag must name the version that was built.
          for f in dist/i-bin-*.txt; do grep -qx "version=${GITHUB_REF_NAME#v}" "$f"; done
          if ! gh release create "$GITHUB_REF_NAME" dist/*.tar.gz checksums/*.sha256 \
              --verify-tag --title "i ${{ github.ref_name }}" --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz checksums/*.sha256 --clobber
          fi
      - name: Write the nix/release.nix fragment
        shell: bash
        run: |
          set -euo pipefail
          : > i-bin-fragment.nix
          for f in dist/i-bin-*.txt; do
            platform=$(basename "$f" .txt); platform=${platform#i-bin-}
            version=$(sed -n 's/^version=//p' "$f")
            url=$(sed -n 's/^url=//p' "$f")
            hash=$(sed -n 's/^hash=//p' "$f")
            printf '"%s" = {\n  version = "%s";\n  url = "%s";\n  hash = "%s";\n};\n' \
              "$platform" "$version" "$url" "$hash" >> i-bin-fragment.nix
          done
          cat i-bin-fragment.nix
          { echo '### Entries for nix/release.nix'; echo '```nix'; cat i-bin-fragment.nix; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-bin-fragment
          path: i-bin-fragment.nix
          if-no-files-found: error
