# Builds `i` with Nix for every platform of the matrix, packages it as the
# archive that `packages.<system>.i-bin` installs, and checks that archive end
# to end through the `i-bin` package.
#
# Pushing a `v*` tag is the only way to publish: only then does the `publish`
# job run and create (or update) the GitHub release.
#
# A pull-request run is a gate, so it must be minutes: it restores the archive
# built by the nightly run on main (same Nix inputs) and smokes it in a
# container without Nix. Only a cache miss builds. A cold build is the Nix
# store closure, not `i`; see docs/development.md.
#
# After a successful tag run, copy the entries of the `i-bin-fragment`
# artifact (also shown in the run summary) into `nix/release.nix`.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'crates/**/build.rs'
      - 'rust-toolchain.toml'
  # Fills the archive cache that pull-request gates restore, so a gate is a
  # smoke test rather than a cold build.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Read only for the build jobs; `publish` raises it for the tag run.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Every push to a pull request is the same `refs/pull/N/merge`, so a dry run
  # queued behind an older one would wait for its whole cold build (hours) and
  # never gate anything. A newer push cancels the dry run; tag and manual runs
  # must finish, so they keep `false`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # A cold store builds Python, CMake, LLVM and rustc from source for the
    # toolchain (a change low in the closure, such as `tzdata` below, reaches
    # all of them). The store is cached between runs, so only the first run
    # after such a change pays for it; the ceiling is GitHub's.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Adding a platform is adding an entry to the NIX_RELEASE_MATRIX
      # repository variable (JSON, same keys); the default is all three
      # supported platforms. An entry needs a runner in this repository's
      # configuration.
      #
      # A pull request builds the two Linux archives only: they are the ones
      # the release ships as a portable binary, and a three-platform cold build
      # cannot gate a pull request (it is hours). NIX_RELEASE_MATRIX_PR
      # overrides that set, as NIX_RELEASE_MATRIX overrides the full one. A tag
      # or a manual run still builds all three.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && (vars.NIX_RELEASE_MATRIX_PR || '[{"platform":"x86_64-linux","system":"x86_64-linux","runner":"ubuntu-24.04"},{"platform":"aarch64-linux","system":"aarch64-linux","runner":"ubuntu-24.04-arm"}]') || (vars.NIX_RELEASE_MATRIX || '[{"platform":"x86_64-linux","system":"x86_64-linux","runner":"ubuntu-24.04"},{"platform":"aarch64-linux","system":"aarch64-linux","runner":"ubuntu-24.04-arm"},{"platform":"aarch64-darwin","system":"aarch64-darwin","runner":"macos-15"}]')) }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /opt/microsoft /opt/google \
            /usr/local/share/chromium /usr/lib/jvm
          df -h /
      # Binaryen is fetched by Nix, not from the submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      # The gate is the smoke test below, not a rebuild: the archive is keyed
      # by every input that changes the build (the flake pins, the packaging
      # script, the manifests) and by the platform. A tag never restores: a
      # release builds the tree it names.
      - name: Restore the archive
        id: archive
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: dist
          key: i-archive-${{ matrix.system }}-${{ hashFiles('nix/**', 'flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'crates/**/build.rs', 'rust-toolchain.toml') }}
      - name: Read the cached version
        if: steps.archive.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "VERSION=$(sed -n 's/^version=//p' dist/i-bin-${{ matrix.platform }}.txt)" >> "$GITHUB_ENV"
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: steps.archive.outputs.cache-hit != 'true'
        with:
          extra-conf: |
            always-allow-substitutes = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        if: steps.archive.outputs.cache-hit != 'true'
        with:
          use-flakehub: disabled
          use-gha-cache: enabled
          source-revision: cd88146e8de45fc50afaee98634fea04249c3c13
      - name: Read the version
        if: steps.archive.outputs.cache-hit != 'true'
        run: echo "VERSION=$(nix eval --raw .#packages.${{ matrix.system }}.i.version)" >> "$GITHUB_ENV"
      - name: Build i
        if: steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          out=$(nix build --print-out-paths .#packages.${{ matrix.system }}.i -L)
          ln -sfn "$out" result-i
          seconds=$(( $(date +%s) - start ))
          echo "Built \`i\` $VERSION for ${{ matrix.platform }} in $seconds s."
          echo "cold build: $(( (seconds + 59) / 60 )) min for ${{ matrix.platform }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Independent evidence for Darwin: only system libraries, no store
      # paths. This is what decides whether i-bin can be installed elsewhere.
      - name: Check the Darwin dependencies of i
        if: runner.os == 'macOS' && steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          otool -L result-i/bin/i | tee otool-i.txt
          deps=$(tail -n +2 otool-i.txt | awk '{print $1}')
          bad=$(echo "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "i links non-system libraries:" >&2
            echo "$bad" >&2
            exit 1
          fi
      # Independent evidence for Linux: a static musl binary names no
      # interpreter, no shared library and no RPATH, so nothing in it can
      # resolve through this machine's store. v0.1.0 passed every other check
      # here and still could not start without `/nix`.
      - name: Check the Linux dependencies of i
        if: runner.os == 'Linux' && steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          file result-i/bin/i
          if readelf -l result-i/bin/i | grep 'Requesting program interpreter'; then
            echo "i names an ELF interpreter; it will not start without it" >&2
            exit 1
          fi
          # `ldd` exits 1 for a file it cannot load as dynamic, which a static
          # binary is; the text is what matters.
          ldd result-i/bin/i > ldd-i.txt 2>&1 || true
          cat ldd-i.txt
          case "$(cat ldd-i.txt)" in
            *"not a dynamic executable"*|*"statically linked"*) ;;
            *) echo "i is a dynamic executable (see ldd-i.txt)" >&2; exit 1 ;;
          esac
          if objdump -p result-i/bin/i | grep -E '^[[:space:]]+(NEEDED|RPATH|RUNPATH)'; then
            echo "i needs shared libraries or carries an RPATH" >&2
            exit 1
          fi
          # Strings are not loads; list them anyway. A store path among them
          # is what would tie the archive to the machine that built it.
          strings -a result-i/bin/i | grep -E '^/(nix/store|build)/' | sort -u > build-paths-i.txt || true
          {
            echo "### Paths of the build machine in \`i\` (${{ matrix.platform }})"
            echo '```'
            cat build-paths-i.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Rust's std panic locations are remapped to `/nix/store/eeee…`,
          # a prefix that is not a real store path; anything else is.
          stored=$(grep '^/nix/store/' build-paths-i.txt | grep -v '^/nix/store/eeee' || true)
          if [ -n "$stored" ]; then
            echo "i names store paths:" >&2
            echo "$stored" >&2
            exit 1
          fi
      # `i new` resolves the newest `stdlib-vX.Y.Z` through git, and the
      # published tag is the *released* library, which an unreleased compiler
      # may not build. Serve this checkout's library under the tag `i new`
      # will ask for; the container smoke mounts the same directory.
      - name: Prepare the library for the smoke
        shell: bash
        run: |
          set -euo pipefail
          library="$RUNNER_TEMP/library"
          # A version no published tag can have. If the `file://` mapping
          # ever stops working, `i new` asks for this version and fails
          # loudly instead of resolving the real, older library and passing
          # (or failing with errors that look like a compiler bug).
          smoke_version="$VERSION-dev.$(git rev-parse --short=12 HEAD)"
          echo "SMOKE_VERSION=$smoke_version" >> "$GITHUB_ENV"
          rm -rf "$library"
          cp -a stdlib "$library"
          chmod -R u+w "$library"
          git -C "$library" init -q
          git -C "$library" -c user.email=i@example.invalid -c user.name=i add -A
          git -C "$library" -c user.email=i@example.invalid -c user.name=i commit -qm "library $smoke_version"
          git -C "$library" -c user.email=i@example.invalid -c user.name=i tag "stdlib-v$smoke_version"
      - name: Smoke test
        if: steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          i="$PWD/result-i/bin/i"
          test "$("$i" --version)" = "i $VERSION"
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/home"
          cd "$work"
          export HOME="$work/home"
          export ILANG_GIT_URLS="github.com/nmnmcc/i=file://$RUNNER_TEMP/library"
          # The smoke must not reach the network: with one, it can resolve a
          # library that has nothing to do with this checkout and still pass.
          # `file://` above is the only source, and Linux runs it in an empty
          # network namespace to prove that. macOS has no `unshare -n`, so it
          # relies on the single source plus the version assertion below: one
          # step weaker. The container step is `--network none` on Linux.
          if [ "$(uname -s)" = Linux ]; then
            run=(sudo env "HOME=$HOME" "PATH=$PATH" "ILANG_GIT_URLS=$ILANG_GIT_URLS" unshare -n --)
          else
            run=(env)
          fi
          "${run[@]}" "$i" new demo
          grep -qF "github.com/nmnmcc/i//stdlib@$SMOKE_VERSION" demo/i.toml
          echo "library: $(grep -F 'github.com/nmnmcc/i//stdlib@' demo/i.toml)"
          out=$("${run[@]}" "$i" run --project demo)
          echo "$out"
          test "$out" = "Hello, demo!"
          "${run[@]}" "$i" build >/dev/null
          test "$(./build/demo)" = "Hello, demo!"
      - name: Package
        if: steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 nix/package.py --binary result-i/bin/i --version "$VERSION" \
            --platform "${{ matrix.platform }}" --output dist | tee package.out
          name=$(sed -n 's/^url-name: //p' package.out)
          sri=$(sed -n 's/^hash: //p' package.out)
          mkdir -p checksums
          (cd dist && shasum -a 256 "$name") > "checksums/$name.sha256"
          # Tag runs publish under the pushed tag; dry runs show the tag a release would use.
          if [ "${{ github.ref_type }}" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$name"
          printf 'version=%s\nurl=%s\nhash=%s\n' "$VERSION" "$url" "$sri" > "dist/i-bin-${{ matrix.platform }}.txt"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "URL=$url" >> "$GITHUB_ENV"
          { echo "### ${{ matrix.platform }}"; echo '```'; cat "dist/i-bin-${{ matrix.platform }}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Read the cached archive
        if: steps.archive.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          file=$(ls dist/i-*-${{ matrix.platform }}.tar.gz)
          echo "NAME=$(basename "$file")" >> "$GITHUB_ENV"
          echo "The archive is from the cache; the container smoke below is the gate." >> "$GITHUB_STEP_SUMMARY"
      # The archive has to run on a machine that has no Nix at all. This is
      # the only step that would have caught v0.1.0: `nix build` and the
      # `i-bin` install pass on a machine with `/nix` whatever the archive
      # names as its loader. No continue-on-error; a failure fails the run,
      # and `publish` needs this job.
      - name: Prepare the smoke image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # git for `i new`, binutils and file for the static assertions. The
          # image is built here; the smoke itself then runs without network.
          docker build -q -t i-smoke - <<'DOCKER'
          FROM debian:stable-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                git binutils file >/dev/null && rm -rf /var/lib/apt/lists/*
          DOCKER
      - name: Run the archive in a container without Nix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/archive"
          mkdir -p "$extracted"
          tar -xzf "dist/$NAME" -C "$extracted"
          test -x "$extracted/bin/i"
          # debian:stable-slim has no git, and `i new` resolves the newest
          # `stdlib-vX.Y.Z` through it. A dry run's tag is not published, so
          # the prepared library is mounted instead.
          library="$RUNNER_TEMP/library"
          test -d "$library/.git"
          docker run --rm --network none \
            -v "$extracted:/d:ro" \
            -v "$library:/library:ro" \
            -e "ILANG_GIT_URLS=github.com/nmnmcc/i=file:///library" \
            -e "VERSION=$VERSION" \
            -e "SMOKE_VERSION=$SMOKE_VERSION" \
            i-smoke sh -c '
              set -eu
              export PATH="/d/bin:$PATH"
              # The archive must be static in itself, not merely start because
              # this container happens to carry a library. Same evidence as the
              # build job, taken inside the container.
              binary=$(command -v i)
              file "$binary"
              if readelf -l "$binary" | grep -q "Requesting program interpreter"; then
                echo "i names an ELF interpreter; it will not start without it" >&2
                exit 1
              fi
              if objdump -p "$binary" | grep -qE "^[[:space:]]+(NEEDED|RPATH|RUNPATH)"; then
                echo "i needs shared libraries or carries an RPATH" >&2
                exit 1
              fi
              # The mounts belong to the runner user; the container is root.
              git config --global --add safe.directory "*"
              test "$(i --version)" = "i $VERSION"
              cd /tmp
              i new demo
              cd demo
              grep -qF "github.com/nmnmcc/i//stdlib@$SMOKE_VERSION" i.toml
              echo "library: $(grep -F 'github.com/nmnmcc/i//stdlib@' i.toml)"
              out=$(i run)
              test "$out" = "Hello, demo!"
              # The native executable `i build` writes embeds the runner the
              # compiler carries, so it has to run here too.
              i build >/dev/null
              test "$(./build/demo)" = "Hello, demo!"
              echo "$out"
            '
          echo "The archive ran in a container without Nix." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the archive as i-bin
        if: steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$extracted"
          tar -xzf "dist/$NAME" -C "$extracted"
          test "$("$extracted/bin/i" --version)" = "i $VERSION"
          # The fetchurl output path is the hash and the file name, so the
          # add-file copy resolves the release url without a download.
          nix store add-file "dist/$NAME" >/dev/null
          sri=$(nix hash file --type sha256 --sri "dist/$NAME")
          grep -qx "hash=$sri" "dist/i-bin-${{ matrix.platform }}.txt"
          # --impure only for builtins.getFlake on the local checkout.
          nix build --impure -L --out-link result-i-bin --expr "let f = builtins.getFlake (toString ./.); in (f.packages.\"${{ matrix.system }}\".i-bin).override { artifact = { version = \"$VERSION\"; url = \"$URL\"; hash = \"$sri\"; }; }"
          test "$(./result-i-bin/bin/i --version)" = "i $VERSION"
          test "$(./result-i-bin/bin/i --version)" = "$(./result-i/bin/i --version)"
      - name: Check the Darwin dependencies of i-bin
        if: runner.os == 'macOS' && steps.archive.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          otool -L result-i-bin/bin/i | tee otool-i-bin.txt
          deps=$(tail -n +2 otool-i-bin.txt | awk '{print $1}')
          bad=$(echo "$deps" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "i-bin links non-system libraries:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-${{ matrix.platform }}
          path: |
            dist/i-*-${{ matrix.platform }}.tar.gz
            dist/i-bin-${{ matrix.platform }}.txt
            checksums/i-*-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Runs after every build leg succeeded; a failed build must not publish a
    # partial release.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      # The artifacts hold dist/ and checksums/, so they are merged into the workspace root.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: i-*
          merge-multiple: true
          path: .
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist checksums
          # The tag must name the version that was built.
          for f in dist/i-bin-*.txt; do grep -qx "version=${GITHUB_REF_NAME#v}" "$f"; done
          if ! gh release create "$GITHUB_REF_NAME" dist/*.tar.gz checksums/*.sha256 \
              --verify-tag --title "i ${{ github.ref_name }}" --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz checksums/*.sha256 --clobber
          fi
      - name: Write the nix/release.nix fragment
        shell: bash
        run: |
          set -euo pipefail
          : > i-bin-fragment.nix
          for f in dist/i-bin-*.txt; do
            platform=$(basename "$f" .txt); platform=${platform#i-bin-}
            version=$(sed -n 's/^version=//p' "$f")
            url=$(sed -n 's/^url=//p' "$f")
            hash=$(sed -n 's/^hash=//p' "$f")
            printf '"%s" = {\n  version = "%s";\n  url = "%s";\n  hash = "%s";\n};\n' \
              "$platform" "$version" "$url" "$hash" >> i-bin-fragment.nix
          done
          cat i-bin-fragment.nix
          { echo '### Entries for nix/release.nix'; echo '```nix'; cat i-bin-fragment.nix; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i-bin-fragment
          path: i-bin-fragment.nix
          if-no-files-found: error
