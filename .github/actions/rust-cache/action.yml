name: Rust cache
description: >-
  Swatinem/rust-cache with one 15 s retry when a restore did not hit.

  A restore can fail with HTTP 429 while the cache service is over its download
  quota. The action reports that as `cache-hit: false`, the same as a genuine
  miss, so the job would compile everything. One retry after the observed
  Retry-After window recovers the hit. A second miss is reported and the build
  continues: the cache is an optimization, never a gate.
inputs:
  key:
    description: The action's `key` input.
    required: true
  cache-directories:
    description: The action's `cache-directories` input.
    required: false
    default: ""
  cmd-format:
    description: The action's `cmd-format` input.
    required: false
    default: "{0}"
  save-if:
    description: The action's `save-if` input.
    required: false
    default: "true"
  cache-on-failure:
    description: The action's `cache-on-failure` input.
    required: false
    default: "false"
outputs:
  cache-hit:
    description: Whether an exact cache match was restored.
    value: ${{ steps.retry.outputs.cache-hit || steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore
      id: restore
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.key }}
        cache-directories: ${{ inputs.cache-directories }}
        cmd-format: ${{ inputs.cmd-format }}
        save-if: ${{ inputs.save-if }}
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - name: Warn about the retry
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::warning::no cache entry restored (likely a 429); retrying once after 15 s"
        sleep 15

    - name: Retry the restore
      id: retry
      if: steps.restore.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.key }}
        cache-directories: ${{ inputs.cache-directories }}
        cmd-format: ${{ inputs.cmd-format }}
        save-if: false
        cache-on-failure: ${{ inputs.cache-on-failure }}

    - name: Report the retry
      if: steps.retry.outcome != 'skipped'
      shell: bash
      env:
        HIT: ${{ steps.retry.outputs.cache-hit }}
      run: |
        if [[ "$HIT" == "true" ]]; then
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "cache: restored on retry" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "::warning::proceeding without cache after one retry"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            echo "cache: one retry, still a miss" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
